name: Publish

# Publishes to PyPI via Trusted Publisher on every version tag. The build job
# verifies that the tag matches the package version. workflow_dispatch stays
# available for re-running a release manually.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Check tag matches package version
        run: |
          version=$(uv version --short)
          git fetch --tags --quiet
          git tag --points-at HEAD | grep -qx "v$version" || { echo "HEAD is not tagged v$version"; exit 1; }
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI Trusted Publisher (no API token)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v6
      - run: uv publish
