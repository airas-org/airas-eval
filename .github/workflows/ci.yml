name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync dependencies (locked)
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy src
      - name: Test
        run: uv run pytest -q
      - name: Smoke-test the CLI as a consumer would (installed from this checkout)
        run: |
          uvx --from . airas-eval list
          uvx --from . airas-eval score nas_pre_training --inputs examples/nas_pre_training.json
          uvx --from . airas-eval score nas_post_training --inputs examples/nas_post_training.json

  scigym-pack:
    # ベンチマークパックは重い依存(SciGym とシミュレータ一式)を持つので、本体とは別に確かめる
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Sync dependencies with the scigym extra (locked)
        run: uv sync --frozen --extra scigym
      - name: Test the pack against the benchmark's own evaluator
        run: uv run --no-sync pytest -q tests/test_scigym.py
