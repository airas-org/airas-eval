name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync dependencies (locked)
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy src
      - name: Test
        run: uv run pytest -q
      - name: Build and smoke-test the wheel as a consumer would
        run: |
          uv build
          uvx --from dist/*.whl airas-eval list
          uvx --from dist/*.whl airas-eval score nas_pre_training --inputs examples/nas_pre_training.json
          uvx --from dist/*.whl airas-eval score nas_post_training --inputs examples/nas_post_training.json
