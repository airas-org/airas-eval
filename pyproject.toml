[project]
name = "airas-eval"
version = "0.12.3"
description = "Trusted evaluation layer for AIRAS: the full fixed set of standard metrics per task type, computed from raw predictions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "airas-org" }]
keywords = ["evaluation", "metrics", "neural-architecture-search", "reproducibility", "ai-scientist"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26,<2.4",  # 2.4 の型スタブは PEP 695 を使い、mypy の 3.10 ターゲットで解釈できない
    "scikit-learn>=1.5",
    "scipy>=1.11",
    "pydantic>=2.7",
]

# ベンチマークパックの依存。PyPI に無い git 固定の依存を含むので、airas-eval 自体も
# git（タグ）で配布する。利用側は `airas-eval[scigym]` を [tool.uv.sources] の git 指定で入れる
[project.optional-dependencies]
scigym = [
    "scigym @ git+https://github.com/h4duan/SciGym@88a7b93609e35b6ecb4eb343d816d6ff09256c6a",
    "pygraphviz==2.0.2rc1",  # Evaluator が反応グラフの構築に使う。SciGym 自身は依存に挙げていない
]

[project.urls]
Homepage = "https://github.com/airas-org/airas-eval"
Repository = "https://github.com/airas-org/airas-eval"
Issues = "https://github.com/airas-org/airas-eval/issues"

[project.scripts]
airas-eval = "airas_eval.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11.8",
    "mypy>=1.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/airas_eval"]

[tool.uv]
prerelease = "allow"  # pygraphviz の aarch64 wheel は 2.0 のリリース候補にしか無い

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Metric descriptions are Japanese prose; wrapping them hurts more than it helps.
"src/airas_eval/tasks/generic/_metric_sets.py" = ["E501"]
"src/airas_eval/tasks/nas/_metric_sets.py" = ["E501"]
"src/airas_eval/tasks/generic/_inputs.py" = ["E501"]
"src/airas_eval/tasks/nas/_inputs.py" = ["E501"]
"src/airas_eval/tasks/scigym/_metric_sets.py" = ["E501"]
"src/airas_eval/tasks/scigym/_inputs.py" = ["E501"]
"src/airas_eval/tasks/scigym/small.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
# numpy's generic ndarray parameters add noise without catching real bugs here
disallow_any_generics = false
warn_return_any = false
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "sklearn.*",
    "scipy.*",
    "scigym.*",
    "pygraphviz.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
